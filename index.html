<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Birthday Countdown</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;color:white;background:radial-gradient(ellipse at top,#49305f,#171222 55%,#08080d)}
.card{width:min(700px,100%);padding:45px 20px;text-align:center;border:1px solid #ffffff30;border-radius:28px;background:#ffffff0c;box-shadow:0 20px 70px #0008}
.cake{font-size:55px}
.tag{color:#f7cc72;letter-spacing:4px;font-size:12px;margin:18px}
h1{font-size:clamp(35px,8vw,58px);margin:12px 0}
p{color:#c8bfd2}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:35px}
.unit{background:#090811;border:1px solid #f7cc7240;border-radius:16px;padding:22px 5px}
.num{font-size:clamp(30px,7vw,48px);font-weight:bold;color:#f7cc72;font-variant-numeric:tabular-nums}
.label{font-size:11px;color:#ccc;margin-top:10px;letter-spacing:1px}
.date{margin-top:30px;color:#f7cc72}
footer{margin-top:35px;color:#999;font-size:12px}
@media(max-width:420px){.count{gap:5px}.unit{padding:17px 2px}.label{font-size:9px}}
</style>
</head>
<body>
<main class="card">
<div class="cake">🎂</div>
<div class="tag">THE CELEBRATION IS COMING</div>
<h1>My Birthday<br>Countdown</h1>
<p>Every second brings my special day closer ✨</p>
<div class="count">
<div class="unit"><div class="num" id="days">--</div><div class="label">DAYS</div></div>
<div class="unit"><div class="num" id="hours">--</div><div class="label">HOURS</div></div>
<div class="unit"><div class="num" id="minutes">--</div><div class="label">MINUTES</div></div>
<div class="unit"><div class="num" id="seconds">--</div><div class="label">SECONDS</div></div>
</div>
<div class="date">🗓️ 28 November</div>
<div id="message" style="display:none;color:#f7cc72;margin-top:25px">🎉 Happy Birthday! 🎉</div>
<footer>Made with love ✨</footer>
</main>
<script>
function nextBirthday(){
 const now=new Date();
 let year=now.getFullYear();
 let target=new Date(year,10,28,0,0,0);
 if(now>=target)target=new Date(year+1,10,28,0,0,0);
 return target;
}
let target=nextBirthday();
function update(){
 const now=new Date();
 if(now>=target){document.getElementById('message').style.display='block';target=nextBirthday();}
 let diff=Math.max(0,target-now);
 document.getElementById('days').textContent=String(Math.floor(diff/86400000)).padStart(2,'0');
 document.getElementById('hours').textContent=String(Math.floor(diff%86400000/3600000)).padStart(2,'0');
 document.getElementById('minutes').textContent=String(Math.floor(diff%3600000/60000)).padStart(2,'0');
 document.getElementById('seconds').textContent=String(Math.floor(diff%60000/1000)).padStart(2,'0');
}
update();setInterval(update,1000);
</script>
</body>
</html>
